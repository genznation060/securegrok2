name: Build APK

on:
  workflow_dispatch:   # You can run it manually
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kiosk APK (recommended)
        run: ./gradlew :app:assembleKiosk --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-Kiosk-APK
          path: app/build/outputs/apk/kiosk/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
